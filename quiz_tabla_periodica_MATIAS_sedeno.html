<style>
body{

    color:white;

}
.container{
    max-width:600px;
    margin:auto;
    background:rgba(0,0,0,0.4);
    padding:20px;
    border-radius:20px;
}
button{
    display:block;
    width:100%;
    margin:10px 0;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}
button:hover{
    background:#ddd;
    color:black;
}
img{
    width:200px;
    border-radius:10px;
    margin-top:10px;
    display:none;
}
.timer{

}
.credito{

}

<body>
<div class="container">
<h1>⚗️ Quiz Tabla Periódica</h1>
<p class="credito"><b>Hecho por Luis Matias Sedeño Gil</b></p>

<div id="menu">
    <button onclick="startGame()">Iniciar Juego</button>
</div>

<div id="quiz" style="display:none;">

    <h2 id="question"></h2>

];

// FUNCIONES DEL JUEGO
function shuffle(array){return array.sort(()=>Math.random()-0.5);}
function generarPreguntasUnicas(cantidad){
let banco=[];
elementos.forEach(el=>{
let incorrectos = elementos.filter(e=>e!==el);
incorrectos = shuffle(incorrectos).slice(0,3);
let opciones = shuffle([el.simbolo,incorrectos[0].simbolo,incorrectos[1].simbolo,incorrectos[2].simbolo]);
banco.push({q:`¿Cuál es el símbolo del elemento ${el.nombre}?`,img:el.img,options:opciones,correct:opciones.indexOf(el.simbolo)});
});
banco = shuffle(banco);
return banco.slice(0,cantidad);
}

let preguntas=[],current=0,score=0,timer,timeLeft=10;

function startGame(){
preguntas = generarPreguntasUnicas(10);
current=0;score=0;
document.getElementById("menu").style.display="none";
document.getElementById("quiz").style.display="block";
loadQuestion();
}

function loadQuestion(){
if(current>=preguntas.length){endGame();return;}
let q = preguntas[current];
document.getElementById("question").innerText=q.q;
const img=document.getElementById("image");
img.style.display="none";img.src=q.img;
const answersDiv=document.getElementById("answers");
answersDiv.innerHTML="";
q.options.forEach((opt,index)=>{
const btn=document.createElement("button");btn.innerText=opt;btn.onclick=()=>checkAnswer(index,q);answersDiv.appendChild(btn);
});
startTimer();
}

function startTimer(){
timeLeft=10;document.getElementById("time").innerText=timeLeft;
timer=setInterval(()=>{
timeLeft--;document.getElementById("time").innerText=timeLeft;
if(timeLeft<=0){clearInterval(timer);showFail("⏰ Tiempo terminado!",preguntas[current]);}
},1000);
}

function checkAnswer(index,q){
clearInterval(timer);
if(index===q.correct){alert("✅ Correcto!");score++;next();}
else{showFail("❌ Incorrecto",q);}
}

function showFail(text,q){
const img=document.getElementById("image");img.style.display="block";
setTimeout(()=>{alert(text+"\nRespuesta correcta: "+q.options[q.correct]);next();},600);
}

function next(){current++;loadQuestion();}

function endGame(){
document.getElementById("quiz").style.display="none";
document.getElementById("result").innerHTML=`
<h2>Juego terminado</h2>
<h3>Puntaje: ${score}/10</h3>
<p class="credito"><b>Hecho por Luis Matias Sedeño Gil</b></p>
<button onclick="location.reload()">Jugar otra vez</button>
`;
}
